[project]
name = "ictg"
version = "0.1.0"
description = "CTG conversion utilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "pydantic>=2.11.10",
    "zipfile-deflate64>=0.2.0",
]

[project.scripts]
ictg = "ictg.convert.main:convert_raw_ctg"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pandas-stubs>=2.3.2",
    "pyarrow-stubs>=20.0.0.20251215",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src/ictg", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

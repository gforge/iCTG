[project]
name = "ctg-preprocess"
version = "0.1.0"
description = "CTG reduction and registry matching pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "pyarrow>=23.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pandas-stubs>=2.3.2",
    "pyarrow-stubs>=20.0.0.20251215",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
python_version = "3.12"
files = ["."]
exclude = ["legacy/", "\\.venv/"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

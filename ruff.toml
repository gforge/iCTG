# Shared ruff configuration for all three sub-projects (src/ictg, CTG_preprocess, CTG_ML).
# Run from the repository root: `uvx ruff check` and `uvx ruff format`.
line-length = 100
target-version = "py312"

extend-exclude = [
    "**/.venv",
    "**/artifacts*",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length is enforced by `ruff format`; long SQL/strings are allowed
]

[lint.isort]
# the flat CTG_preprocess scripts import each other as top-level modules
known-first-party = [
    "ictg", "ctg_ml", "config", "secrets_store", "ctg_reduction", "registry_matching",
    "match_loss_report", "cohort_report", "time_shift",
]

[format]
quote-style = "double"

[project]
name = "ctg-ml"
version = "0.1.0"
description = "ML experiments for CTG-based Apgar prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "duckdb>=1.1",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "tqdm>=4.66",
  "xgboost>=3.2.0",
  "matplotlib>=3.10.9",
]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "ruff>=0.6",
]
# torch is not a default group: on the shared machine it comes from the /opt
# micromamba environment via `--system-site-packages` (see README). Install it
# explicitly with `uv sync --group torch` on machines without that environment.
torch = [
  "torch>=2.4",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctg_ml"]

[tool.mypy]
python_version = "3.12"
files = ["src/ctg_ml", "scripts", "tests"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

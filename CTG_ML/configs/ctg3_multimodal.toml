[paths]
ctg_parquet = "data/CTG3/ctg_final.parquet"
registry_csv = "data/CTG3/registry.csv"
artifacts_dir = "artifacts_ctg3"

[split]
train_fraction = 0.70
val_fraction = 0.15
test_fraction = 0.15
random_seed = 42

[sequence]
window_minutes = 60
sample_rate_hz = 1
pad_short = true
treat_fhr_zero_as_missing = true
treat_toco_zero_as_missing = true
include_padding_mask = true
include_signal_quality_channels = true
# Green is the implicit baseline when both of these are 0.
quality_levels = ["Y", "R"]
output_dir = "artifacts_ctg3/tcn_multimodal_60m"
chunk_vectors_per_batch = 64

[registry]
# Inputs represent information considered available around the last hour before birth.
input_numeric = [
  "maternal_age",
  "gestational_days",
  "etablerade_varkar_seconds",
  "para_mhv1",
  "langd_inskrivning_cm",
  "bmi_inskrivning",
  "alkohol_audit_poang",
]
input_boolean = [
  "is_smoker",
  "diabetes_mellitus",
  "previous_c_section",
  "is_girl",
  "gestational_hypertension_without_significant_proteinuria",
  "preeclampsia",
  "gestational_or_pregestational_diabetes",
  "heavy_vaginal_bleeding_before_or_during_delivery",
  "labor_dystocia",
  "use_of_oxytocin",
]
input_categorical = [
  "forlossningsstart",
  "fodelseland",
  "utbildningsniva",
  "tobak_3_manader_fore_graviditet",
  "tobak_inskrivning",
  "tobak_vecka_30_32",
]
input_excluded_due_to_leakage = [
]
categorical_other_min_frequency = 50
country_top_k = 15
apgar_outputs = ["apgar1", "apgar5", "apgar10"]
categorical_outputs = ["forlossningsslut"]
continuous_outputs = ["ph_navelartar", "ph_navelven"]
binary_outputs = [
  "ph_navel_below7",
  "shoulder_dystocia",
  "treatment_for_hypoglycemia",
  "neonatal_sepsis_or_pneumonia",
  "neonatal_anemia",
  "respiratorbehandling",
]
binary_outputs_missing_as_false = [
  "shoulder_dystocia",
  "treatment_for_hypoglycemia",
  "neonatal_sepsis_or_pneumonia",
  "neonatal_anemia",
  "respiratorbehandling",
]

[model]
tcn_channels = [32, 32, 64, 64, 64, 128, 128, 128]
kernel_size = 7
dropout = 0.1
tabular_hidden_dim = 64
fusion_hidden_dim = 128

[train]
learning_rate = 0.0005
batch_size = 128
epochs = 100
weight_decay = 0.0001
# Tempered inverse-frequency class weighting for Apgar 0..10 classification.
# 0.0 disables weighting; 0.5 is a conservative first pass.
apgar_class_weight_power = 0.0
regression_loss_weight = 1.0
binary_loss_weight = 2.0
gradient_clip_norm = 1.0
use_amp = true
seed = 51
deterministic = false
monitor_binary_tasks = [
  "apgar1_below7",
  "apgar5_below7",
  "shoulder_dystocia",
  "treatment_for_hypoglycemia",
  "neonatal_anemia",
  "respiratorbehandling",
]
early_stopping_enabled = true
early_stopping_min_epochs = 10
early_stopping_patience = 10
early_stopping_min_delta = 0.0005
# Self-supervised initialisation of the TCN sequence encoder (see [pretrain]).
# Empty string = random init. `--init-encoder PATH` on the CLI overrides this.
init_encoder = ""
# Keep the sequence encoder frozen for the first N supervised epochs (0 = never frozen).
freeze_encoder_epochs = 0

[pretrain]
# Self-supervised masked-reconstruction pretraining of the TCN sequence encoder on
# unlabeled CTG windows from ALL sessions of ALL pregnancies (antenatal and earlier
# labour sessions). Either a single parquet file or a directory of *.parquet buckets.
pretrain_parquet = "data/CTG3/ctg_pretrain.parquet"
window_minutes = 60
stride_minutes = 30
# Windows need at least this fraction of non-missing (non-zero) FHR samples.
min_signal_fraction = 0.5
# Fraction of timesteps whose FHR/toco inputs are zeroed, in contiguous spans.
mask_ratio = 0.3
mask_span_seconds = 30
epochs = 30
batch_size = 64
lr = 0.001
weight_decay = 0.0001
# Drop windows overlapping the supervised last-hour window (`in_final_window` rows).
exclude_final_window = true
seed = 51
# Outputs go to `<paths.artifacts_dir>/<out_subdir>/` (shards, metadata, encoder.pt).
out_subdir = "pretrain"
# Fraction of pretraining BabyIDs held out for early stopping on reconstruction loss.
val_fraction = 0.1
early_stopping_patience = 5
windows_per_shard = 2048
chunk_vectors_per_batch = 64
decoder_hidden_dim = 64
decoder_kernel_size = 9
use_amp = true
